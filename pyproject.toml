[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "netproxy"
version = "0.3.0"
authors = [{ name = "Jose A." }]
description = "Rule-routed asyncio proxy server: per-destination mTLS with keystore client certificates, upstream proxy chaining, tunnels and TLS interception"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Internet :: Proxy Servers",
    "Typing :: Typed",
]
dependencies = [
    "sslcontext>=2.1.0,<3",
    "proxylib>=2.0,<3",
    "netimps>=0.4.1,<0.5",
    # Configuration files; TOML is read by tomllib, before 3.11 by tomli.
    "anycfg>=0.14.0,<0.15",
    "tomli>=2.0,<3; python_version < '3.11'",
]

[project.optional-dependencies]
cli = ["duho>=0.7.0,<0.8"]
# Configuration files written in YAML (#!yaml, .yaml).
yaml = ["anycfg[yaml]>=0.14.0,<0.15"]
# PcapRecorder; TCPFlowWriter was added in pktcap 0.1.2.
capture = ["pktcap>=0.1.2,<0.2"]
# dukpy executes generated PAC scripts in the tests.
dev = ["black", "build", "pytest", "dukpy", "netproxy[cli,capture,yaml]"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
netproxy = "netproxy.cli:main"

[project.urls]
Homepage = "https://github.com/jose-pr/netproxy/"
Documentation = "https://jose-pr.github.io/netproxy/"
Issues = "https://github.com/jose-pr/netproxy/issues"

[tool.hatch.build.targets.sdist]
exclude = ["/.*", "/AGENTS.md", "/benchmarks", "*.local.*", "CLAUDE*"]

[tool.hatch.build.targets.wheel]
packages = ["src/netproxy"]
exclude = ["*.local.*", "CLAUDE*"]

[tool.black]
target-version = ["py39"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]
